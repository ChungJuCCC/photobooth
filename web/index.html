<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>내 사진 받기</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="guest.css">
</head>
<body>
  <main class="page" aria-live="polite">
    <p class="event" id="event-name" hidden></p>

    <section class="state" data-state="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p class="lede">사진을 불러오고 있어요</p>
    </section>

    <section class="state" data-state="pending" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <h1>사진을 올리는 중이에요</h1>
      <p class="lede">부스에서 막 찍은 사진이 올라가고 있어요. 이 화면을 열어두면 준비되는 대로 바로 보여드릴게요.</p>
      <button class="button secondary" type="button" data-action="recheck">지금 다시 확인</button>
    </section>

    <section class="state" data-state="ready" hidden>
      <figure class="print">
        <img id="photo" alt="부스에서 찍은 사진">
      </figure>
      <figure class="print" id="video-figure" hidden>
        <video id="video" muted loop playsinline autoplay></video>
        <figcaption>촬영하는 동안의 모습을 빠르게 담았어요</figcaption>
      </figure>
      <p class="hint" id="long-press-hint" hidden>저장 버튼이 안 되면 사진을 길게 눌러 저장하세요</p>
    </section>

    <section class="state" data-state="expired" hidden>
      <h1>보관 기간이 끝났어요</h1>
      <p class="lede">사진과 영상은 올라간 뒤 24시간 동안만 보관해요. 이미 삭제되어 다시 받을 수 없어요.</p>
    </section>

    <section class="state" data-state="invalid" hidden>
      <h1>QR 주소를 알아볼 수 없어요</h1>
      <p class="lede">부스 화면에 나온 QR을 다시 찍어주세요.</p>
    </section>

    <section class="state" data-state="error" hidden>
      <h1>연결이 불안정해요</h1>
      <p class="lede">인터넷 연결을 확인한 뒤 다시 시도해주세요.</p>
      <button class="button secondary" type="button" data-action="recheck">다시 시도</button>
    </section>
  </main>

  <aside class="sheet" id="sheet" hidden>
    <p class="countdown" id="countdown"></p>
    <div class="actions">
      <button class="button primary" type="button" id="save-photo">사진 저장</button>
      <button class="button secondary" type="button" id="save-video" hidden>영상 저장</button>
    </div>
  </aside>

  <script src="config.js"></script>
  <script type="module" src="guest.js"></script>
</body>
</html>
